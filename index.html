<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHMT LAB | AI Experiment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Hitam Pekat AMOLED */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
        }
        .chat-container {
            height: calc(100vh - 160px);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; }
        
        .glass-input {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #333;
            outline: none;
        }
        .message-user { border-left: 2px solid #555; }
        .message-ai { border-left: 2px solid #00ff41; } /* Vibe Hacker/Lab */
    </style>
</head>
<body class="p-4 flex flex-col items-center">

    <header class="w-full max-w-2xl mb-6 border-b border-zinc-800 pb-2 flex justify-between items-end">
        <div>
            <h1 class="text-xl font-bold tracking-widest text-white">RHMT LAB <span class="text-xs font-normal opacity-50">v2.5-Flash</span></h1>
            <p class="text-xs text-zinc-500">Pria Solo AI Experimentation</p>
        </div>
        <div id="status" class="text-[10px] text-zinc-600 uppercase tracking-tighter italic">Sistem Siap...</div>
    </header>

    <main id="chatBox" class="chat-container w-full max-w-2xl overflow-y-auto space-y-4 mb-4 p-2">
        <div class="message-ai p-3 bg-zinc-900/50 rounded">
            <p class="text-sm">Sistem aktif. Silahkan masukkan instruksi, Pria Solo siap membantu.</p>
        </div>
    </main>

    <div class="w-full max-w-2xl fixed bottom-6 bg-black">
        <div class="relative flex gap-2">
            <input type="text" id="userInput" placeholder="Ketik pesan..." 
                class="w-full p-4 pr-16 glass-input text-white rounded-md focus:border-zinc-500 transition-all">
            <button onclick="sendMessage()" id="sendBtn" class="bg-white text-black px-4 py-2 rounded font-bold hover:bg-zinc-300 transition-all">
                Kirim
            </button>
        </div>
    </div>

    <script>
        // MASUKKAN API KEY LO DISINI (BISA BANYAK/ROTASI)
        const keys = [
            "API_KEY_1_LO",
            "API_KEY_2_LO"
        ];
        let currentKeyIndex = 0;

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const statusText = document.getElementById('status');

        // Handle Enter
        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Tambah chat user ke UI
            appendMessage('user', text);
            userInput.value = "";
            statusText.innerText = "Berpikir...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${keys[currentKeyIndex]}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiResponse = data.candidates[0].content.parts[0].text;
                    appendMessage('ai', aiResponse);
                } else {
                    throw new Error("Limit tercapai atau Key mati.");
                }

            } catch (error) {
                console.error(error);
                // Rotasi Key jika error
                currentKeyIndex = (currentKeyIndex + 1) % keys.length;
                appendMessage('ai', "Waduh, koneksi ke 'Pusat' keganggu sebentar. Coba lagi ya, sistem lagi ganti jalur.");
            } finally {
                statusText.innerText = "Online";
            }
        }

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = role === 'user' ? 'message-user p-3 bg-zinc-900/30 rounded ml-8' : 'message-ai p-3 bg-zinc-900/60 rounded mr-8';
            div.innerHTML = `<span class="text-[10px] font-bold opacity-30 uppercase">${role}</span><p class="text-sm mt-1">${text}</p>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
              </html>
