<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHMT LAB | Pria Solo AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Hitam Pekat AMOLED */
        body { 
            background-color: #000; 
            color: #e5e5e5; 
            font-family: 'Inter', sans-serif; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            margin: 0; 
        }
        .chat-area { 
            flex: 1; 
            overflow-y: auto; 
            padding: 1.5rem; 
            scroll-behavior: smooth; 
        }
        /* Bubble Chat Style */
        .bubble { 
            max-width: 85%; 
            padding: 12px 16px; 
            border-radius: 20px; 
            margin-bottom: 1.2rem; 
            font-size: 0.95rem; 
            line-height: 1.6; 
        }
        .user { 
            background: #1a1a1a; 
            align-self: flex-end; 
            margin-left: auto; 
            border-bottom-right-radius: 4px; 
            color: #fff;
        }
        .ai { 
            background: transparent; 
            align-self: flex-start; 
            border: 1px solid #262626; 
            border-bottom-left-radius: 4px; 
        }
        /* Sticky Input Area */
        .input-bar { 
            padding: 1.5rem; 
            background: linear-gradient(to top, #000 80%, transparent); 
        }
        .input-container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: #121212; 
            border: 1px solid #2a2a2a; 
            border-radius: 28px; 
            display: flex; 
            padding: 6px 16px; 
            align-items: center; 
        }
        input { 
            background: transparent; 
            border: none; 
            outline: none; 
            color: #fff; 
            flex: 1; 
            padding: 10px; 
            font-size: 0.95rem;
        }
        .btn-send { 
            background: #fff; 
            color: #000; 
            width: 34px; 
            height: 34px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: transform 0.2s;
        }
        .btn-send:active { transform: scale(0.9); }
        ::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body>
    <header class="p-4 border-b border-zinc-900 text-center">
        <h1 class="text-[10px] tracking-[0.4em] text-zinc-600 font-bold uppercase">RHMT LAB EXPERIMENT</h1>
    </header>

    <div id="chatBox" class="chat-area flex flex-col">
        <div class="bubble ai shadow-sm">
            Inggih. Wonten menapa? Saya siap membantu eksperimen Anda.
        </div>
    </div>

    <div class="input-bar">
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Tanya Pria Solo..." autocomplete="off">
            <button onclick="send()" class="btn-send">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
                    <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" />
                </svg>
            </button>
        </div>
        <p class="text-[9px] text-center mt-3 text-zinc-800 uppercase tracking-widest">Scraper Mode • Pria Solo AI</p>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        async function send() {
            const msg = userInput.value.trim();
            if(!msg) return;

            // Tambah pesan user
            chatBox.innerHTML += `<div class="bubble user animate-pulse">${msg}</div>`;
            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Loading state
            const loadId = "id-" + Date.now();
            chatBox.innerHTML += `<div id="${loadId}" class="bubble ai italic text-zinc-500">Sedang berpikir...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Sesuai endpoint di server.js
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ query: msg }) // Ganti 'message' jadi 'query' sesuai logic scraper lo
                });
                const data = await res.json();
                
                // Jika sukses, ganti teks loading dengan jawaban asli
                const bubbleAi = document.getElementById(loadId);
                bubbleAi.classList.remove('italic', 'text-zinc-500');
                bubbleAi.innerText = data.answer || "Maaf, sistem sedang ndak bisa menjawab.";
            } catch (e) {
                document.getElementById(loadId).innerText = "Koneksi ke Pusat terputus.";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        userInput.addEventListener("keypress", (e) => {
            if(e.key === "Enter") send();
        });
    </script>
</body>
</html>
