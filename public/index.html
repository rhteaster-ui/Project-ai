<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHMT LAB | Pria Solo AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #e5e5e5; font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; margin: 0; }
        .chat-area { flex: 1; overflow-y: auto; padding: 1.5rem; scroll-behavior: smooth; }
        .bubble { max-width: 85%; padding: 12px 16px; border-radius: 18px; margin-bottom: 1rem; font-size: 0.95rem; line-height: 1.5; }
        .user { background: #1a1a1a; align-self: flex-end; margin-left: auto; border-bottom-right-radius: 4px; }
        .ai { background: transparent; align-self: flex-start; border: 1px solid #262626; border-bottom-left-radius: 4px; }
        .input-bar { padding: 1.5rem; background: linear-gradient(to top, #000 80%, transparent); }
        .input-container { max-width: 800px; margin: 0 auto; background: #121212; border: 1px solid #2a2a2a; border-radius: 25px; display: flex; padding: 5px 15px; align-items: center; }
        input { background: transparent; border: none; outline: none; color: #fff; flex: 1; padding: 10px; }
        .btn-send { background: #fff; color: #000; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        ::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body>
    <header class="p-4 border-b border-zinc-900 text-center text-[10px] tracking-[0.3em] text-zinc-500 font-bold">RHMT LAB EXPERIMENT</header>
    <div id="chatBox" class="chat-area flex flex-col">
        <div class="bubble ai">Halo. Saya siap membantu.</div>
    </div>
    <div class="input-bar">
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Tanya Pria Solo..." autocomplete="off">
            <button onclick="send()" class="btn-send">↑</button>
        </div>
    </div>
    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        async function send() {
            const msg = userInput.value.trim();
            if(!msg) return;
            chatBox.innerHTML += `<div class="bubble user">${msg}</div>`;
            userInput.value = '';
            const loadId = "id-" + Date.now();
            chatBox.innerHTML += `<div id="${loadId}" class="bubble ai">...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                document.getElementById(loadId).innerText = data.reply || data.error;
            } catch (e) { document.getElementById(loadId).innerText = "Server Error."; }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        userInput.addEventListener("keypress", (e) => { if(e.key === "Enter") send(); });
    </script>
</body>
</html>
